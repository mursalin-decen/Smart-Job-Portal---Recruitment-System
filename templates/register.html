{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl border border-slate-200 shadow-md my-4">
    <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">Create a New Account</h2>
    <form method="POST" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-1">First Name</label>
                <input type="text" name="first_name" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Last Name</label>
                <input type="text" name="last_name" required class="w-full px-3 py-2 border rounded-lg">
            </div>
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-3 py-2 border rounded-lg">
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg">
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Account Role</label>
            <select name="user_type" class="w-full px-3 py-2 border rounded-lg bg-white">
                <option value="JOB_SEEKER">Job Seeker</option>
                <option value="JOB_PROVIDER">Employer / Job Provider</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold transition">Register</button>
    </form>
</div>
{% endblock %}
