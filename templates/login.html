{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl border border-slate-200 shadow-md my-8">
    <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">Login to Your Account</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-bold transition shadow-md shadow-indigo-100">Login</button>
    </form>
</div>
{% endblock %}
